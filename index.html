<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALOURA — Eau de Parfum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="description" content="ALOURA — eau de parfum. Paiement à la livraison en Algérie.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@200;300;400;500&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050d;
  --ink:#efe6dc;
  --muted:#a89d93;
  --gold:#d9bf8c;
  --cream:#e9dcc3;
  --glass:rgba(24,18,30,.62);
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#0a0807;color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-weight:300}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}

/* ---------- header ---------- */
.logo{letter-spacing:.55em;font-size:15px;font-weight:400;padding-left:2px}
.tools{display:flex;gap:10px}
.round{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:rgba(30,22,36,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:grid;place-items:center}
.round svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--cream);color:#1a1320;
  font-size:10px;font-weight:500;display:grid;place-items:center;padding:0 4px;transform:scale(0);transition:transform .3s}
.badge.on{transform:scale(1)}

/* ---------- display case ---------- */
.app{container-type:size}
.case{position:absolute;inset:0;background:#0a0807;overflow:hidden}
.stage{--sw:min(100cqw,66.667cqh);position:absolute;width:var(--sw);height:calc(var(--sw)*1.5);
  left:calc((100cqw - var(--sw))/2);top:calc((100cqh - var(--sw)*1.5)/2);
  container-type:size;transform-origin:0 0;transition:transform .28s cubic-bezier(.3,.7,.2,1);will-change:transform;
  background:#0a0807}
.bg{position:absolute;inset:0;background:center/100% 100% no-repeat;transition:filter .25s ease}
.stage.zoom{transition-delay:0s}
.stage.zoom .bg{filter:blur(.6px)}
.item{position:absolute;inset:0;pointer-events:none;transition:opacity .25s,filter .25s}
.photo{position:absolute;display:block;height:19.5%;width:auto;transform:translate(-50%,-100%);user-select:none;-webkit-user-drag:none;
  filter:brightness(.93) contrast(1.05) drop-shadow(0 .6cqh 1cqh rgba(0,0,0,.6))}
.shadow{position:absolute;width:15cqw;height:2.2cqw;transform:translate(-50%,-55%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%);filter:blur(2px)}
.price{position:absolute;transform:translate(-50%,-50%);font-size:3.5cqw;letter-spacing:.05em;color:#d3c1aa;
  text-shadow:0 1px 6px rgba(0,0,0,.7);white-space:nowrap}
.photo.cloth{height:19.5%;filter:drop-shadow(0 .8cqh 1.2cqh rgba(0,0,0,.65)) brightness(.95)}
.item.soon .price{font-size:3cqw;letter-spacing:.34em;opacity:.38}
.hit{position:absolute;pointer-events:auto;cursor:pointer}
.hint{position:absolute;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;
  font-size:11px;letter-spacing:.32em;color:#b4a99c;font-weight:300;text-transform:uppercase;transition:opacity .5s}
.stage.zoom .item:not(.sel){opacity:.55;filter:blur(1.5px)}
.night{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;
  background:radial-gradient(ellipse var(--rx,24%) var(--ry,26%) at var(--cx,50%) var(--cy,50%),transparent 0 45%,rgba(4,3,14,.84) 100%)}
.stage.zoom .night{opacity:.3;animation:nightSeq .6s ease forwards}
@keyframes nightSeq{0%{opacity:0}22%{opacity:1}55%{opacity:.95}100%{opacity:.3}}
/* each other lamp dies on its own: warm flicker, then dark */
.pool{position:absolute;pointer-events:none;opacity:0;transform:translateX(-50%);
  background:radial-gradient(ellipse 60% 75% at 50% 6%,rgba(3,2,10,.97) 0,rgba(3,2,10,.9) 35%,rgba(3,2,10,0) 78%)}
.pool.off{animation:lampDie .8s linear var(--d,0s) both}
@keyframes lampDie{0%{opacity:0}14%{opacity:.25}22%{opacity:.05}38%{opacity:.6}46%{opacity:.3}64%{opacity:.85}72%{opacity:.7}100%{opacity:1}}
/* chosen lamp: slow warm-up, soft falloff, no hard edges */
.beam{position:absolute;pointer-events:none;opacity:0;mix-blend-mode:screen;filter:blur(14px);transform:translateX(-50%);
  background:linear-gradient(180deg,var(--b1,rgba(255,226,175,.34)),var(--b2,rgba(255,210,150,.12)) 60%,var(--b3,rgba(255,210,150,0)));
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  -webkit-mask-image:radial-gradient(ellipse 60% 100% at 50% 0,#000 35%,transparent 80%);mask-image:radial-gradient(ellipse 60% 100% at 50% 0,#000 35%,transparent 80%)}
.stage.zoom .beam{animation:warmUp .5s ease-out .05s both}
.glow{position:absolute;pointer-events:none;opacity:0;mix-blend-mode:screen;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,var(--g1,rgba(255,200,130,.34)),var(--g2,rgba(255,190,120,.1)) 55%,transparent 72%)}
.wash{position:absolute;pointer-events:none;opacity:0;mix-blend-mode:soft-light;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,var(--w1,rgba(255,205,140,.9)),transparent 68%)}
.stage.zoom .glow,.stage.zoom .wash{animation:warmUp .5s ease-out .08s both}
@keyframes warmUp{0%{opacity:0}12%{opacity:.5}20%{opacity:.15}34%{opacity:.7}44%{opacity:.45}100%{opacity:1}}
.stage.zoom .item.sel .photo{filter:brightness(1.08) contrast(1.06) drop-shadow(0 .6cqh 1cqh rgba(0,0,0,.6));transition:filter .4s ease 0s}
.mote{position:absolute;width:.55cqw;height:.55cqw;border-radius:50%;background:var(--m,rgba(255,236,200,.9));opacity:0;pointer-events:none;filter:blur(.3px)}
.stage.zoom .mote{animation:drift var(--t,9s) ease-in-out var(--d,0s) infinite}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}15%{opacity:var(--o,.7)}50%{transform:translate(var(--dx,2cqw),4cqw)}85%{opacity:var(--o,.7)}100%{opacity:0;transform:translate(calc(var(--dx,2cqw)*-1),9cqw)}}
.lamp{position:absolute;width:11%;height:1.6%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse,var(--l1,#fffbee),var(--l2,#ffe4b0) 50%,transparent 75%);box-shadow:0 0 5cqw 1.4cqw var(--ls,rgba(255,214,150,.6))}
.stage.zoom .lamp{animation:warmUp .4s ease-out 0s both}
.stage.zoom .lamp{opacity:1;animation:beamOn .4s ease-out .05s both}
.hint.off{opacity:0}
.dim{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0;transition:opacity .25s;
  background:linear-gradient(180deg,rgba(0,0,0,.25) 0,transparent 25%,transparent 45%,rgba(5,3,10,.88) 100%)}
.dim.on{opacity:1}

/* ---------- product panel ---------- */
.panel{position:absolute;z-index:20;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);
  padding:20px 20px 18px;border-radius:26px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(34,27,42,.82),rgba(18,13,24,.9));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateY(120%);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none}
.panel.on{transform:none;opacity:1;pointer-events:auto;transition-delay:.1s}
.panel .eyebrow{font-size:10.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.panel h2{font-size:30px;font-weight:300;margin:8px 0 10px;letter-spacing:.005em}
.notes{display:flex;gap:16px;color:var(--muted);font-size:13px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.size{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);font-size:13px;color:var(--muted);transition:.25s}
.size.on{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.04)}
.add{width:100%;padding:17px;border-radius:14px;background:var(--cream);color:#1c1520;
  font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;transition:transform .15s,background .3s}
.add:active{transform:scale(.98)}
.add .dot{opacity:.5;margin:0 6px}
.x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:round}

/* ---------- drawers ---------- */
.sheet{position:fixed;z-index:40;inset:0;max-width:480px;margin:0 auto;pointer-events:none;overflow:hidden}
.sheet .veil{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .4s}
.sheet .box{position:absolute;top:0;bottom:0;right:0;width:min(88%,380px);padding:calc(env(safe-area-inset-top) + 20px) 22px 22px;
  background:linear-gradient(180deg,#171120,#0c0813);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{pointer-events:auto}.sheet.on .veil{opacity:1}.sheet.on .box{transform:none}
.sheet.left .box{right:auto;left:0;border-left:0;border-right:1px solid var(--line);transform:translateX(-102%)}
.sheet.left.on .box{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sh-head h3{font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:400}
.lines{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line b{font-weight:400;font-size:15px}
.line small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:14px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:15px;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center;line-height:1.7}
.total{display:flex;justify-content:space-between;padding:16px 0;font-size:15px}
.ghost{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);font-size:12px;letter-spacing:.26em;text-transform:uppercase;
  text-align:center;display:block;text-decoration:none;color:var(--ink);margin-top:10px}
.menu a,.menu button.m{display:block;width:100%;text-align:left;padding:18px 0;font-size:22px;font-weight:200;
  border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.menu p{color:var(--muted);font-size:12px;margin-top:auto;line-height:1.7}

.toast{position:fixed;z-index:60;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-20px);
  background:var(--cream);color:#1c1520;padding:11px 18px;border-radius:30px;font-size:12px;letter-spacing:.14em;
  opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- scrolling sections ---------- */
.cue{position:absolute;z-index:6;left:50%;bottom:6px;width:1px;height:16px;background:linear-gradient(180deg,transparent,#c9b8a3);animation:cue 2s ease-in-out infinite}
@keyframes cue{0%,100%{opacity:.2;transform:translateY(-3px)}50%{opacity:.9;transform:none}}
.more{max-width:480px;margin:0 auto;background:#0a0807;overflow:hidden}
.sec{padding:84px 24px 20px}
.eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.sec h2{font-size:32px;line-height:1.15;font-weight:200;margin:14px 0 26px;letter-spacing:.005em}
.sec p{color:#bdb1a6;font-size:15px;line-height:1.75;margin-bottom:16px}
.sec p.lead{color:var(--ink);font-size:17px;font-weight:300}
.orn{height:1px;width:64px;background:linear-gradient(90deg,var(--gold),transparent);margin:-6px 0 24px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}
.trio div{padding:18px 8px;border:1px solid var(--line);border-radius:16px;text-align:center;background:rgba(255,255,255,.02)}
.trio b{display:block;font-weight:300;font-size:17px;letter-spacing:.06em;margin-bottom:6px}
.trio span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.cards{display:grid;gap:16px}
.card{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:22px;
  background:radial-gradient(120% 120% at 20% 0,rgba(217,191,140,.10),rgba(255,255,255,.02) 60%)}
.card img{width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55))}
.card .no{font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.card h3{font-weight:300;font-size:22px;margin:6px 0}
.card .nt{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.card button{padding:11px 16px;border-radius:12px;border:1px solid var(--line);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.card button:active{background:rgba(255,255,255,.06)}
.card.soon{opacity:.45;grid-template-columns:1fr;text-align:center;padding:26px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.foot{padding-bottom:calc(env(safe-area-inset-bottom) + 40px);border-top:1px solid var(--line);margin-top:70px;background:linear-gradient(180deg,#0a0807,#050404)}
.fl{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:30px}
.fl button{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.copy{font-size:11px;line-height:1.9;color:#6f665e;letter-spacing:.08em}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- checkout ---------- */
.view{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
.view[hidden]{display:none}
.sums{padding:12px 0 4px;border-top:1px solid var(--line);font-size:14px}
.sums div{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.sums div.t{color:var(--ink);font-size:16px;padding-top:10px}
.cod{font-size:11px;letter-spacing:.12em;color:var(--gold);text-align:center;margin:12px 0}
.primary{width:100%;padding:17px;border-radius:14px;background:var(--cream);color:#1c1520;font-size:12px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;margin-top:6px;flex:none}
.primary:disabled{opacity:.5}
.back{align-self:flex-start;font-size:12px;letter-spacing:.14em;color:var(--muted);padding:2px 0 14px}
.fields{display:grid;gap:12px}
.fields label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.fields label em{text-transform:none;letter-spacing:0;font-style:normal;opacity:.7}
.fields input,.fields select{display:block;width:100%;margin-top:7px;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:15px;letter-spacing:0;text-transform:none;outline:0;appearance:none;-webkit-appearance:none}
.fields select option{color:#111}
.fields input:focus,.fields select:focus{border-color:var(--gold)}
.fields .bad{border-color:#d0605e}
.done-ic{width:54px;height:54px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:24px;margin:10px 0 16px}
#vDone h4{font-weight:300;font-size:24px;margin-bottom:10px}
#vDone p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:14px}
#vDone pre{white-space:pre-wrap;font:inherit;font-size:12.5px;line-height:1.7;color:#cbbfb3;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:rgba(255,255,255,.03)}

/* ---------- redesign: layout, type, new sections ---------- */
:root{--serif:"Cormorant Garamond","Tajawal",Georgia,serif}
.shell{display:block}
.panel{max-width:460px;margin:0 auto}
.sec h2,.panel h2,.card h3,#vDone h4,.menu button.m{font-family:var(--serif)}
.sec h2{font-size:40px;line-height:1.08;font-weight:300}
.panel h2{font-size:36px;font-weight:400}
.card h3{font-size:28px;font-weight:400}
.menu button.m{font-size:28px;font-weight:300}
.lang{font-size:13px;font-weight:500;letter-spacing:.04em}
.empty,.copy{white-space:pre-line}
.hero h1{font-family:var(--serif);font-weight:300;font-size:48px;line-height:1.02;margin:14px 0 22px}
.hero{padding-top:70px}
.cta{display:inline-block;margin:6px 0 4px;padding:16px 26px;border-radius:14px;background:var(--cream);color:#1c1520;font-size:12px;font-weight:500;letter-spacing:.26em;text-transform:uppercase}
.trust{display:grid;gap:10px;margin-top:32px}
.trust div{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02)}
.trust b{display:block;font-weight:400;font-size:15px;color:var(--ink);margin-bottom:4px}
.trust span{font-size:12.5px;color:var(--muted);line-height:1.5}
.cards{grid-template-columns:1fr}
.card{grid-template-columns:112px 1fr}
.card .pr{font-size:15px;color:var(--cream);margin-bottom:14px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.card .acts button{padding:11px 14px}
.card .acts .buy{background:var(--cream);color:#1c1520;border-color:var(--cream);font-weight:500}
.steps{list-style:none;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02)}
.steps i{font-style:normal;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:22px}
.steps b{display:block;font-weight:400;font-size:16px;margin-bottom:4px}
.steps span{font-size:13.5px;line-height:1.6;color:var(--muted)}
.faq details{border-bottom:1px solid var(--line);padding:6px 0}
.faq summary{cursor:pointer;list-style:none;padding:16px 0;font-size:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--gold);font-size:22px;font-weight:200;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 16px}
.top{position:fixed;z-index:30;left:0;right:0;top:0;max-width:480px;margin:0 auto;direction:ltr;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;border-bottom:1px solid transparent;transition:background .4s,border-color .4s}
.top.solid{background:linear-gradient(180deg,rgba(10,8,7,.94),rgba(10,8,7,.72));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-color:var(--line)}
.fields input[type=tel]{direction:ltr;text-align:start}
.add{white-space:nowrap;letter-spacing:.2em}
.pnav{position:absolute;top:16px;right:62px;display:flex;gap:8px}
.pnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center;padding-bottom:3px}
html[dir=rtl] .pnav{right:auto;left:62px}
.panel.swap{animation:pswap .2s ease}
@keyframes pswap{0%{opacity:.15;transform:translateY(14px)}100%{opacity:1;transform:none}}
.stage.zoom.switching{transition-delay:0s;transition-duration:.25s}
.stage.switching .pool{animation:none!important}
.stage.switching .pool.off{opacity:1}
.stage.switching .pool:not(.off){opacity:0}
.zoomed .app{touch-action:none}
/* men / women: each fragrance gets its own light */
.stage.g-m{--b1:rgba(185,212,255,.32);--b2:rgba(150,185,235,.12);--b3:rgba(150,185,235,0);--g1:rgba(150,190,255,.32);--g2:rgba(130,170,230,.10);--w1:rgba(165,195,250,.85);--l1:#f4f8ff;--l2:#bcd4ff;--ls:rgba(165,195,255,.6);--m:rgba(215,230,255,.9)}
.stage.g-f{--b1:rgba(255,205,218,.36);--b2:rgba(255,175,200,.14);--b3:rgba(255,175,200,0);--g1:rgba(255,170,195,.36);--g2:rgba(255,150,180,.12);--w1:rgba(255,185,205,.9);--l1:#fff5f7;--l2:#ffc9d6;--ls:rgba(255,185,205,.65);--m:rgba(255,215,225,.95)}
.stage.g-m .mote{width:.4cqw;height:.4cqw}

if(!I18N[LANG]) LANG = /^ar/i.test(navigator.language||'') ? 'ar' : 'fr';
const t = k => (I18N[LANG][k] ?? I18N.fr[k] ?? k);
const noteName = n => (NOTES[n] ? NOTES[n][LANG] : n);

const $ = s => document.querySelector(s);
const caseEl = $('#stage'), panel = $('#panel'), dim = $('#dim');
let bag = [];   // {id,size,qty}
try { bag = JSON.parse(localStorage.getItem('aloura-bag')||'[]'); } catch(e){}
function moneyL(n,l){ return Number(n).toLocaleString('fr-FR').replace(/[\u202f\u00a0\s]/g,'\u00a0') + '\u00a0' + I18N[l].cur; }
const money = n => moneyL(n,LANG);
function pixel(ev,data){ try{ if(window.fbq) fbq('track',ev,data); }catch(_){} }
function track(name,data){ try{ if(window.va) window.va('event',{name,data}); }catch(_){} }
(function(){ const id=CONFIG.metaPixelId; if(!id) return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',id); fbq('track','PageView'); })();
const WILAYAS = ["Adrar","Chlef","Laghouat","Oum El Bouaghi","Batna","Béjaïa","Biskra","Béchar","Blida","Bouira","Tamanrasset","Tébessa","Tlemcen","Tiaret","Tizi Ouzou","Alger","Djelfa","Jijel","Sétif","Saïda","Skikda","Sidi Bel Abbès","Annaba","Guelma","Constantine","Médéa","Mostaganem","M'Sila","Mascara","Ouargla","Oran","El Bayadh","Illizi","Bordj Bou Arréridj","Boumerdès","El Tarf","Tindouf","Tissemsilt","El Oued","Khenchela","Souk Ahras","Tipaza","Mila","Aïn Defla","Naâma","Aïn Témouchent","Ghardaïa","Relizane","Timimoun","Bordj Badji Mokhtar","Ouled Djellal","Béni Abbès","In Salah","In Guezzam","Touggourt","Djanet","El M'Ghair","El Meniaa"];
let current = null, size = 100, openedAt = 0, swT;

/* ---- build the scene ---- */
caseEl.insertAdjacentHTML('afterbegin',`<div class="bg" style="background-image:url(img/niche-${CONFIG.theme==='dark'?'dark':'warm'}.jpg)"></div>`);
PRODUCTS.forEach(p=>{
  const S=SLOTS[p.slot], it=document.createElement('div'); it.className='item'+(p.soon?' soon':''); it.dataset.id=p.id;
  const first=p.sizes?Object.keys(p.sizes)[0]:0;
  it.innerHTML = (p.soon?`<div class="shadow" style="left:${S.x}%;top:${S.base}%"></div><img class="photo cloth" src="img/velvet.webp" alt="Coming soon" draggable="false" style="left:${S.x}%;top:${S.base+.6}%">`:'')
    + (p.img?`<div class="shadow" style="left:${S.x}%;top:${S.base}%"></div><img class="photo" src="${p.img}" alt="${p.name}" draggable="false" style="left:${S.x}%;top:${S.base}%">`:'')
    + `<div class="price" style="left:${S.x}%;top:${S.price}%">${p.soon?'SOON':money(p.sizes[first])}</div>`
    + (p.soon?'':`<button class="hit" aria-label="${p.name}" style="left:${S.x-S.w/2}%;top:${S.base-19.5}%;width:${S.w}%;height:${S.bottom-S.base+19.5}%"></button>`);
  if(!p.soon) it.querySelector('.hit').addEventListener('click',()=>openProduct(p.id));
  caseEl.appendChild(it);
});
caseEl.insertAdjacentHTML('beforeend',SLOTS.map((S,i)=>`<div class="pool" data-slot="${i}" style="left:${S.lamp[0]}%;top:${S.lamp[1]-2}%;width:48%;height:${S.bottom-S.lamp[1]+10}%;--d:${[.05,.2,0,.28,.12][i]}s"></div>`).join('')
  +'<div class="night" id="night"></div><div class="wash" id="wash"></div><div class="beam" id="beam"></div><div class="glow" id="glow"></div><div class="lamp" id="lamp"></div><div id="motes"></div>');

/* ---- product zoom ---- */
function openProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p||p.soon) return;
  const switching = !!current && caseEl.classList.contains('zoom');
  current = p; size = +Object.keys(p.sizes)[0]; openedAt = performance.now();
  const it = document.querySelector(`.item[data-id="${id}"]`);
  const prevT = caseEl.style.transform;
  if(switching){ caseEl.style.transition='none'; caseEl.style.transform=''; }   // measure the untransformed scene
  const app = $('#app').getBoundingClientRect(), cr = caseEl.getBoundingClientRect(), br = it.querySelector('.photo').getBoundingClientRect();
  if(switching){
    caseEl.style.transform=prevT; void caseEl.offsetWidth; caseEl.style.transition='';
    caseEl.classList.add('switching'); clearTimeout(swT); swT=setTimeout(()=>caseEl.classList.remove('switching'),300);
    panel.classList.remove('swap'); void panel.offsetWidth; panel.classList.add('swap');
  }
  const W = app.width, H = app.height;
  const px = br.left-cr.left+br.width/2, py = br.top-cr.top+br.height/2;       // bottle centre inside the stage
  const s = Math.min(H*0.30/br.height, W*0.7/br.width, 4);
  const tx = (W/2) - (cr.left-app.left) - px*s, ty = (H*0.36) - (cr.top-app.top) - py*s;
  const S=SLOTS[p.slot], top=S.lamp[1], bot=S.bottom, st=caseEl.style;
  st.setProperty('--cx',S.x+'%'); st.setProperty('--cy',((top+bot)/2)+'%'); st.setProperty('--rx','25%'); st.setProperty('--ry',((bot-top)/2*1.12)+'%');
  const beam=$('#beam').style; beam.left=S.lamp[0]+'%'; beam.top=S.lamp[1]+'%'; beam.width="40%"; beam.height=(S.bottom-S.lamp[1])+'%';
  document.querySelectorAll('.pool').forEach(pl=>pl.classList.toggle('off',+pl.dataset.slot!==p.slot));
  const g=$('#glow').style; g.left=S.x+'%'; g.top=(S.base-.6)+'%'; g.width='34%'; g.height='7%';
  const w=$('#wash').style; w.left=S.x+'%'; w.top=(S.lamp[1]+(S.bottom-S.lamp[1])*.5)+'%'; w.width='56%'; w.height=((S.bottom-S.lamp[1])*1.05)+'%';
  $('#motes').innerHTML=Array.from({length:p.gender==='f'?28:10},()=>`<i class="mote" style="left:${S.lamp[0]-9+Math.random()*18}%;top:${S.lamp[1]+3+Math.random()*(S.bottom-S.lamp[1]-14)}%;--d:${(Math.random()*6).toFixed(1)}s;--t:${(7+Math.random()*6).toFixed(1)}s;--o:${(.35+Math.random()*.5).toFixed(2)};--dx:${(Math.random()*3-1.5).toFixed(1)}cqw"></i>`).join('');
  const lamp=$('#lamp').style; lamp.left=S.lamp[0]+'%'; lamp.top=S.lamp[1]+'%';
  document.querySelectorAll('.item').forEach(n=>n.classList.toggle('sel',n===it));
  caseEl.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  caseEl.classList.toggle('g-m',p.gender==='m'); caseEl.classList.toggle('g-f',p.gender==='f'); caseEl.classList.add('zoom'); document.body.classList.add('zoomed'); dim.classList.add('on'); $('#hint').classList.add('off');
  fillPanel(); panel.classList.add('on');
  pixel('ViewContent',{content_name:p.name,content_ids:[String(p.id)],content_type:'product',value:p.sizes[size],currency:CONFIG.currencyCode}); track('view_product',{product:p.name});
}
function fillPanel(){
  const p=current; if(!p) return;
  $('#pNo').textContent = p.no; $('#pName').textContent = p.name;
  panel.classList.toggle('g-m',p.gender==='m'); panel.classList.toggle('g-f',p.gender==='f');
  $('#pNotes').innerHTML = p.notes.map(n=>`<span>${noteName(n)}</span>`).join(''); $('#pNav').style.display = liveProducts().length>1 ? '' : 'none'; renderSizes();
}
function closeProduct(){
  document.querySelectorAll('.pool').forEach(pl=>pl.classList.remove('off'));
  caseEl.style.transform=''; caseEl.classList.remove('zoom','switching'); panel.classList.remove('swap'); document.body.classList.remove('zoomed'); dim.classList.remove('on'); panel.classList.remove('on'); $('#hint').classList.remove('off'); current=null;
}
function renderSizes(){
  const p=current;
  $('#pSizes').innerHTML = Object.keys(p.sizes).map(sz=>
    `<button class="size ${+sz===size?'on':''}" data-s="${sz}"><span>${sz} ${t('ml')}</span><span>${money(p.sizes[sz])}</span></button>`).join('');
  $('#pSizes').querySelectorAll('.size').forEach(b=>b.onclick=()=>{size=+b.dataset.s;renderSizes();});
  $('#addBtn').innerHTML = `${t('addBag')} <span class="dot">·</span> ${money(p.sizes[size])}`;
}
$('#closeP').onclick = closeProduct;
$('#addBtn').onclick = ()=>addToBag(current,size);

/* ---- bag ---- */
function saveBag(){ try{localStorage.setItem('aloura-bag',JSON.stringify(bag));}catch(e){} renderBag(); }
const unit = l => PRODUCTS.find(x=>x.id===l.id).sizes[l.size];
const subtotal = () => bag.reduce((t,l)=>t+unit(l)*l.qty,0);
function feeFor(w){ const f = (w && CONFIG.deliveryByWilaya[w]!=null) ? CONFIG.deliveryByWilaya[w] : CONFIG.deliveryFee; return f; }
function addToBag(p,sz){
  const f = bag.find(l=>l.id===p.id && l.size===sz);
  f ? f.qty++ : bag.push({id:p.id,size:sz,qty:1});
  saveBag(); toast(t('added').replace('{n}',p.name));
  pixel('AddToCart',{content_name:p.name,content_ids:[String(p.id)],content_type:'product',value:p.sizes[sz],currency:CONFIG.currencyCode}); track('add_to_bag',{product:p.name});
}
function sumsHTML(w){
  const sub=subtotal(), f=feeFor(w);
  return `<div><span>${t('subtotal')}</span><span>${money(sub)}</span></div>
    <div><span>${t('delivery')}</span><span>${f==null?t('byPhone'):(f===0?t('free'):money(f))}</span></div>
    <div class="t"><span>${t('total')}</span><span>${money(sub+(f||0))}${f==null?t('plusDelivery'):''}</span></div>`;
}
/* the summary goes to the shop (WhatsApp / copy), so it is always in French */
function orderText(c){
  const m = n => moneyL(n,'fr');
  const ls = bag.map(l=>{const p=PRODUCTS.find(x=>x.id===l.id);return `${l.qty} × ${p.name} ${l.size}ml — ${m(unit(l)*l.qty)}`;});
  const f=feeFor(c&&c.wilaya), sub=subtotal();
  return [`ALOURA — nouvelle commande (paiement à la livraison)`,
    c?`Nom : ${c.name}\nTéléphone : ${c.phone}\nWilaya : ${c.wilaya}\nAdresse : ${c.addr}`+(c.note?`\nNote : ${c.note}`:''):'',
    ls.join('\n'),
    `Sous-total : ${m(sub)}`, `Livraison : ${f==null?'à confirmer':m(f)}`, `Total : ${m(sub+(f||0))}${f==null?' + livraison':''}`].filter(Boolean).join('\n');
}
function renderBag(){
  const count = bag.reduce((t,l)=>t+l.qty,0);
  document.querySelectorAll('.badge').forEach(b=>{b.textContent=count;b.classList.toggle('on',count>0);});
  $('#lines').innerHTML = bag.length ? bag.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.id);return `
    <div class="line"><div><b>${p.name}</b><br><small>${p.no} · ${l.size} ${t('ml')}</small>
      <div class="qty"><button data-i="${i}" data-d="-1" aria-label="−">−</button>${l.qty}<button data-i="${i}" data-d="1" aria-label="+">+</button></div></div>
      <b>${money(unit(l)*l.qty)}</b></div>`;}).join('')
    : `<div class="empty">${t('empty')}</div>`;
  $('#lines').querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{
    const l=bag[+b.dataset.i]; l.qty+=+b.dataset.d; if(l.qty<1) bag.splice(+b.dataset.i,1); saveBag(); });
  $('#sums').innerHTML = bag.length ? sumsHTML() : '';
  $('#toCheckout').style.display = $('#sums').style.display = $('#vBag .cod').style.display = bag.length?'':'none';
  $('#sums2').innerHTML = sumsHTML($('#fWilaya').value);
}

/* ---- checkout (cash on delivery) ---- */
$('#fWilaya').innerHTML += WILAYAS.map((w,i)=>`<option value="${w}">${String(i+1).padStart(2,'0')} · ${w}</option>`).join('');
$('#fWilaya').addEventListener('change',()=>{ $('#sums2').innerHTML=sumsHTML($('#fWilaya').value); });
let curView='vBag';
function view(v){ curView=v; ['vBag','vForm','vDone'].forEach(id=>$('#'+id).hidden = id!==v);
  $('#bagTitle').textContent = t(v==='vForm'?'formTitle':v==='vDone'?'orderTitle':'bagTitle'); }
$('#toCheckout').onclick = ()=>{ pixel('InitiateCheckout',{value:subtotal(),currency:CONFIG.currencyCode,num_items:bag.reduce((t,l)=>t+l.qty,0)}); track('begin_checkout'); try{ const c=JSON.parse(localStorage.getItem('aloura-cust')||'{}');
    ['Name','Phone','Addr'].forEach(k=>{ if(c[k.toLowerCase()] && !$('#f'+k).value) $('#f'+k).value=c[k.toLowerCase()]; });
    if(c.wilaya) $('#fWilaya').value=c.wilaya; }catch(e){}
  $('#sums2').innerHTML=sumsHTML($('#fWilaya').value); view('vForm'); };
document.querySelectorAll('.fields input,.fields select').forEach(el=>el.addEventListener('input',()=>el.classList.remove('bad')));
$('#backBag').onclick = ()=>view('vBag');
const normPhone = v => { v=v.replace(/[\s.\-()]/g,''); if(v.startsWith('+213')) v='0'+v.slice(4); else if(v.startsWith('00213')) v='0'+v.slice(5); else if(/^213\d{9}$/.test(v)) v='0'+v.slice(3); return v; };
$('#vForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const c={ name:$('#fName').value.trim(), phone:normPhone($('#fPhone').value), wilaya:$('#fWilaya').value, addr:$('#fAddr').value.trim(), note:$('#fNote').value.trim() };
  ['fName','fPhone','fWilaya','fAddr'].forEach(id=>$('#'+id).classList.remove('bad'));
  const bad = [ c.name.length<2&&'fName', !/^0[567]\d{8}$/.test(c.phone)&&'fPhone', !c.wilaya&&'fWilaya', c.addr.length<5&&'fAddr' ].filter(Boolean);
  if(bad.length){ bad.forEach(id=>$('#'+id).classList.add('bad')); $('#'+bad[0]).focus(); return toast(bad[0]==='fPhone'?t('badPhone'):t('badField')); }
  try{ localStorage.setItem('aloura-cust',JSON.stringify(c)); }catch(_){}
  const text=orderText(c), btn=$('#confirmBtn'); btn.disabled=true;
  const items=bag.map(l=>({product:PRODUCTS.find(x=>x.id===l.id).name,size:l.size,qty:l.qty,unitPrice:unit(l)}));
  let sent=false, id='';
  if(CONFIG.orderEndpoint){
    try{ const r=await fetch(CONFIG.orderEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:c,items,subtotal:subtotal(),delivery:feeFor(c.wilaya),payment:'cash_on_delivery',hp:$('#fHp').value})});
      const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw 0; sent=true; id=j.id||''; }catch(_){}
  }
  if(sent){
    pixel('Purchase',{value:subtotal()+(feeFor(c.wilaya)||0),currency:CONFIG.currencyCode,content_type:'product',content_ids:bag.map(l=>String(l.id)),num_items:bag.reduce((t,l)=>t+l.qty,0)}); track('order_placed',{total:subtotal()});
    bag=[]; saveBag(); done(t('okT'),t('okM').replace('{id}',id?t('okId').replace('{id}',id):'').replace('{phone}',c.phone),text);
  } else if(CONFIG.whatsapp){
    const a=document.createElement('a'); a.href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(text)}`; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
    done(t('waT'),t('waM'),text);
  } else {
    done(t('failT'),t('failM'),text);
  }
  btn.disabled=false;
});
function done(t,m,text){ $('#doneTitle').textContent=t; $('#doneMsg').textContent=m; $('#doneText').textContent=text; $('#copyOrder').dataset.text=text; view('vDone'); }
$('#copyOrder').onclick = async()=>{
  try{ await navigator.clipboard.writeText($('#copyOrder').dataset.text||''); toast(t('copied')); }
  catch(e){ toast(t('copyNA')); }
};

/* ---- sheets, toast ---- */
const sheet = (id,on)=>$(id).classList.toggle('on',on);
document.querySelectorAll('[data-bag]').forEach(b=>b.onclick=()=>{ view('vBag'); sheet('#bagSheet',true); });
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>sheet('#menuSheet',true));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{sheet('#bagSheet',false);sheet('#menuSheet',false);}));
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800);}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeProduct();sheet('#bagSheet',false);sheet('#menuSheet',false);} });

/* ---- gestures: scroll/swipe up-down closes, left-right jumps between bottles ---- */
const liveProducts = () => PRODUCTS.filter(p=>!p.soon).sort((a,b)=>a.slot-b.slot);
function stepProduct(d){
  const L=liveProducts(); if(!current||L.length<2) return;
  openProduct(L[(L.indexOf(current)+d+L.length)%L.length].id);
}
$('#pPrev').onclick=()=>stepProduct(-1); $('#pNext').onclick=()=>stepProduct(1);
const sheetOpen = () => document.querySelector('.sheet.on');
let wheelLock=0;
addEventListener('wheel',e=>{
  const now=performance.now();
  if(sheetOpen()||(e.target.closest&&e.target.closest('.sheet'))) return;
  if(!current){ if(now<wheelLock) e.preventDefault(); return; }   // swallow the trackpad momentum right after closing
  e.preventDefault();
  if(now<wheelLock) return;
  const ax=Math.abs(e.deltaX), ay=Math.abs(e.deltaY);
  if(ax>ay){ if(ax>20){ wheelLock=now+800; stepProduct(e.deltaX>0?1:-1); } }
  else if(ay>12){ wheelLock=now+700; closeProduct(); }
},{passive:false});
let tx=0,ty=0,tOn=false;
addEventListener('touchstart',e=>{ tOn=!!current&&!sheetOpen()&&e.touches.length===1&&!(e.target.closest&&e.target.closest('.sheet'));
  if(tOn){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; } },{passive:true});
addEventListener('touchend',e=>{ if(!tOn) return; tOn=false;
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2) stepProduct(dx<0?1:-1);
  else if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)) closeProduct(); },{passive:true});
addEventListener('scroll',()=>{ if(current&&scrollY>30&&performance.now()-openedAt>1200) closeProduct(); },{passive:true});
document.addEventListener('keydown',e=>{ if(!current||sheetOpen()) return;
  if(e.key==='ArrowRight') stepProduct(document.documentElement.dir==='rtl'?-1:1);
  if(e.key==='ArrowLeft') stepProduct(document.documentElement.dir==='rtl'?1:-1); });

/* ---- sections ---- */
const isDesk = () => matchMedia('(min-width:900px)').matches;
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);} }),{threshold:.12}) : null;
function reveal(root){ (root||document).querySelectorAll('.rv:not(.in)').forEach(el=> io ? io.observe(el) : el.classList.add('in')); }
let cardsDone = false;
function renderCards(){
  const cls = cardsDone ? ' in' : '';
  $('#cards').innerHTML = PRODUCTS.map(p=>p.soon ? '' : `
    <div class="card rv${cls}"><img src="${p.img}" alt="${p.name}">
      <div><div class="no">${p.no}</div><h3>${p.name}</h3><div class="nt">${p.notes.map(noteName).join(' · ')}</div>
      <div class="pr">${t('from')} ${money(Math.min(...Object.values(p.sizes)))}</div>
      <div class="acts"><button class="buy" data-buy="${p.id}">${t('addBag')}</button><button data-look="${p.id}">${t('look')}</button></div></div></div>`).join('')
    + (PRODUCTS.some(p=>p.soon)?`<div class="card soon rv${cls}">${t('soonCard')}</div>`:'');
  cardsDone = true; reveal($('#cards'));
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ const p=PRODUCTS.find(x=>x.id===+b.dataset.buy); addToBag(p,+Object.keys(p.sizes)[0]); });
  document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{
    if(isDesk()) return openProduct(+b.dataset.look);   // shelf is already on screen
    const pid=+b.dataset.look; window.scrollTo({top:0,behavior:'smooth'}); const t0=performance.now();
    (function w(){ if(scrollY<4||performance.now()-t0>2500) setTimeout(()=>openProduct(pid),150); else requestAnimationFrame(w); })(); });
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
  sheet('#bagSheet',false); sheet('#menuSheet',false);
  const target=b.dataset.go; closeProduct();
  setTimeout(()=>{ document.getElementById(target).scrollIntoView({behavior:'smooth'}); },200);
}));
/* language */
function applyLang(l){
  LANG=l; try{localStorage.setItem('aloura-lang',l);}catch(_){}
  const h=document.documentElement; h.lang=l; h.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>{ e.textContent=t(e.dataset.i); });
  document.querySelectorAll('[data-i-ph]').forEach(e=>{ e.placeholder=t(e.dataset.iPh); });
  document.querySelectorAll('[data-i-aria]').forEach(e=>{ e.setAttribute('aria-label',t(e.dataset.iAria)); });
  $('#wPh').textContent=t('wChoose');
  $('#langBtn').textContent=t('langBtn'); $('#langBtn').setAttribute('aria-label',t('langName'));
  document.querySelectorAll('.item').forEach(it=>{ const p=PRODUCTS.find(x=>x.id==it.dataset.id);
    it.dataset.g = p.gender||''; const pr=it.querySelector('.price');
    pr.innerHTML = p.soon ? t('soon') : money(p.sizes[Object.keys(p.sizes)[0]]); });
  fillPanel(); renderBag(); renderCards(); view(curView);
}
$('#langBtn').onclick = ()=>applyLang(LANG==='fr'?'ar':'fr');
/* floating header */
const siteTop=$('#siteTop'), cue=$('#cue');
addEventListener('scroll',()=>{ const y=scrollY; siteTop.classList.toggle('solid',y>(isDesk()?10:innerHeight*.7)); cue.style.opacity=y>40?0:''; },{passive:true});
applyLang(LANG); reveal();
</script>
</body>
</html>
