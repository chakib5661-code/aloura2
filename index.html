<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALOURA — Eau de Parfum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050d;
  --ink:#efe6dc;
  --muted:#a89d93;
  --gold:#d9bf8c;
  --cream:#e9dcc3;
  --glass:rgba(24,18,30,.62);
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-weight:300}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}

/* ---------- header ---------- */
.top{position:absolute;z-index:30;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 16px) 18px 0}
.logo{letter-spacing:.55em;font-size:15px;font-weight:400;padding-left:2px}
.tools{display:flex;gap:10px}
.round{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:rgba(30,22,36,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:grid;place-items:center}
.round svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--cream);color:#1a1320;
  font-size:10px;font-weight:500;display:grid;place-items:center;padding:0 4px;transform:scale(0);transition:transform .3s}
.badge.on{transform:scale(1)}

/* ---------- display case ---------- */
.app{container-type:size}
.case{position:absolute;inset:0;background:#0a0807;overflow:hidden}
.stage{--sw:min(100cqw,66.667cqh);position:absolute;width:var(--sw);height:calc(var(--sw)*1.5);
  left:calc((100cqw - var(--sw))/2);top:calc((100cqh - var(--sw)*1.5)/2);
  container-type:size;transform-origin:0 0;transition:transform 1s cubic-bezier(.65,0,.2,1);will-change:transform;
  background:#0a0807 center/100% 100% no-repeat}
.item{position:absolute;inset:0;pointer-events:none;transition:opacity .8s,filter .8s}
.photo{position:absolute;display:block;height:25%;width:auto;transform:translate(-50%,-100%);user-select:none;-webkit-user-drag:none;
  filter:brightness(.93) contrast(1.05) drop-shadow(0 .6cqh 1cqh rgba(0,0,0,.6))}
.shadow{position:absolute;width:15cqw;height:2.2cqw;transform:translate(-50%,-55%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%);filter:blur(2px)}
.price{position:absolute;transform:translate(-50%,-50%);font-size:4.4cqw;letter-spacing:.14em;color:#d3c1aa;
  text-shadow:0 1px 6px rgba(0,0,0,.7);white-space:nowrap}
.item.soon .price{font-size:3cqw;letter-spacing:.34em;opacity:.38}
.hit{position:absolute;pointer-events:auto;cursor:pointer}
.hint{position:absolute;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;
  font-size:11px;letter-spacing:.32em;color:#b4a99c;font-weight:300;text-transform:uppercase;transition:opacity .5s}
.stage.zoom .item:not(.sel){opacity:.55;filter:blur(1.5px)}
.night{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s ease;
  background:radial-gradient(ellipse var(--rx,24%) var(--ry,26%) at var(--cx,50%) var(--cy,50%),transparent 0 52%,rgba(3,2,5,.93) 100%)}
.stage.zoom .night{opacity:1;animation:lightsOut 1.1s linear both}
@keyframes lightsOut{0%{opacity:0}10%{opacity:.35}16%{opacity:.1}30%{opacity:.7}38%{opacity:.4}55%{opacity:.95}62%{opacity:.8}100%{opacity:1}}
.beam{position:absolute;pointer-events:none;opacity:0;mix-blend-mode:screen;filter:blur(6px);transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,226,170,.38),rgba(255,214,150,.10) 55%,rgba(255,214,150,0));
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);transition:opacity .6s}
.stage.zoom .beam{opacity:1;animation:beamOn 1.4s ease-out .55s both}
@keyframes beamOn{0%{opacity:0}20%{opacity:.9}32%{opacity:.3}50%{opacity:1}100%{opacity:1}}
.lamp{position:absolute;width:11%;height:1.6%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse,#fffbee,#ffe4b0 50%,transparent 75%);box-shadow:0 0 5cqw 1.4cqw rgba(255,214,150,.75)}
.stage.zoom .lamp{opacity:1;animation:beamOn 1.4s ease-out .5s both}
.hint.off{opacity:0}
.dim{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0;transition:opacity .6s;
  background:linear-gradient(180deg,rgba(0,0,0,.25) 0,transparent 25%,transparent 45%,rgba(5,3,10,.88) 100%)}
.dim.on{opacity:1}

/* ---------- product panel ---------- */
.panel{position:absolute;z-index:20;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);
  padding:20px 20px 18px;border-radius:26px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(34,27,42,.82),rgba(18,13,24,.9));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateY(120%);opacity:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s;pointer-events:none}
.panel.on{transform:none;opacity:1;pointer-events:auto;transition-delay:.35s}
.panel .eyebrow{font-size:10.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.panel h2{font-size:30px;font-weight:300;margin:8px 0 10px;letter-spacing:.005em}
.notes{display:flex;gap:16px;color:var(--muted);font-size:13px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.size{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);font-size:13px;color:var(--muted);transition:.25s}
.size.on{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.04)}
.add{width:100%;padding:17px;border-radius:14px;background:var(--cream);color:#1c1520;
  font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;transition:transform .15s,background .3s}
.add:active{transform:scale(.98)}
.add .dot{opacity:.5;margin:0 6px}
.x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:round}

/* ---------- drawers ---------- */
.sheet{position:absolute;z-index:40;inset:0;pointer-events:none}
.sheet .veil{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .4s}
.sheet .box{position:absolute;top:0;bottom:0;right:0;width:min(88%,380px);padding:calc(env(safe-area-inset-top) + 20px) 22px 22px;
  background:linear-gradient(180deg,#171120,#0c0813);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{pointer-events:auto}.sheet.on .veil{opacity:1}.sheet.on .box{transform:none}
.sheet.left .box{right:auto;left:0;border-left:0;border-right:1px solid var(--line);transform:translateX(-102%)}
.sheet.left.on .box{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sh-head h3{font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:400}
.lines{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line b{font-weight:400;font-size:15px}
.line small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:14px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:15px;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center;line-height:1.7}
.total{display:flex;justify-content:space-between;padding:16px 0;font-size:15px}
.ghost{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);font-size:12px;letter-spacing:.26em;text-transform:uppercase;
  text-align:center;display:block;text-decoration:none;color:var(--ink);margin-top:10px}
.menu a,.menu button.m{display:block;width:100%;text-align:left;padding:18px 0;font-size:22px;font-weight:200;
  border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.menu p{color:var(--muted);font-size:12px;margin-top:auto;line-height:1.7}

.toast{position:absolute;z-index:60;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-20px);
  background:var(--cream);color:#1c1520;padding:11px 18px;border-radius:30px;font-size:12px;letter-spacing:.14em;
  opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app" id="app">

  <header class="top">
    <div class="logo">ALOURA</div>
    <div class="tools">
      <button class="round" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg></button>
      <button class="round" id="bagBtn" aria-label="Open bag"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8zM9 8V7a3 3 0 0 1 6 0v1"/></svg><span class="badge" id="badge">0</span></button>
    </div>
  </header>

  <section class="case" id="case" aria-label="Fragrance collection">
    <div class="stage" id="stage"></div>
  </section>
  <div class="hint" id="hint">Tap a bottle to look closer</div>
  <div class="dim" id="dim"></div>

  <aside class="panel" id="panel" aria-live="polite">
    <button class="x" id="closeP" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="eyebrow" id="pNo"></div>
    <h2 id="pName"></h2>
    <div class="notes" id="pNotes"></div>
    <div class="sizes" id="pSizes"></div>
    <button class="add" id="addBtn"></button>
  </aside>

  <div class="sheet" id="bagSheet">
    <div class="veil" data-close></div>
    <div class="box">
      <div class="sh-head"><h3>Your bag</h3><button class="x" style="position:static" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="lines" id="lines"></div>
      <div class="total"><span>Total</span><b id="total">$0</b></div>
      <a class="ghost" id="waLink" href="#" style="display:none">Order on WhatsApp</a>
      <button class="ghost" id="copyOrder">Copy order summary</button>
    </div>
  </div>

  <div class="sheet left" id="menuSheet">
    <div class="veil" data-close></div>
    <div class="box menu">
      <div class="sh-head"><h3>Menu</h3><button class="x" style="position:static" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <button class="m" data-close>Collection</button>
      <button class="m" data-close>Our story</button>
      <button class="m" data-close>Contact</button>
      <p>ALOURA · Eau de Parfum<br>Pages for Story &amp; Contact come next.</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</main>

<script>
/* ============ EDIT HERE ============ */
const CONFIG = {
  currency: "$",
  theme: "warm",          // "warm" or "dark" (background image in /img)
  whatsapp: ""            // e.g. "213555123456" (country code + number, no +). Leave empty to hide the button.
};
// Fixed pedestal positions of the background image (percent of the picture). Slot 0-1 top shelf, 2-4 bottom shelf.
const SLOTS = [
  { x:29.6, base:34.5, w:20.8, bottom:45.4, price:40.0, lamp:[29.0,6.4] },
  { x:70.8, base:34.5, w:20.5, bottom:45.4, price:40.0, lamp:[70.5,6.4] },
  { x:22.7, base:78.4, w:22.0, bottom:92.5, price:86.0, lamp:[23.9,50.0] },
  { x:50.1, base:81.0, w:20.5, bottom:92.5, price:87.5, lamp:[49.8,50.0] },
  { x:77.2, base:78.4, w:22.0, bottom:92.5, price:86.0, lamp:[75.4,50.0] }
];
// Each product takes one slot. Empty slots show "SOON". Add the photo in /img and fill in the details.
const PRODUCTS = [
  { id:1, slot:0, no:"N° 01", name:"Aloura Noir",  notes:["Oud","Amber","Vanilla"], sizes:{100:210}, img:"img/aloura-noir.png"  },
  { id:2, slot:1, no:"N° 02", name:"Aloura Rouge", notes:["Rose","Saffron","Musk"], sizes:{100:210}, img:"img/aloura-rouge.png" },
  { id:3, slot:2, soon:true },
  { id:4, slot:3, soon:true },
  { id:5, slot:4, soon:true }
];
/* =================================== */

const $ = s => document.querySelector(s);
const caseEl = $('#stage'), panel = $('#panel'), dim = $('#dim');
let bag = [];   // {id,size,qty}
try { bag = JSON.parse(localStorage.getItem('aloura-bag')||'[]'); } catch(e){}
let current = null, size = 100;

/* ---- build the scene ---- */
caseEl.style.backgroundImage = `url(img/niche-${CONFIG.theme==='dark'?'dark':'warm'}.jpg)`;
PRODUCTS.forEach(p=>{
  const S=SLOTS[p.slot], it=document.createElement('div'); it.className='item'+(p.soon?' soon':''); it.dataset.id=p.id;
  const first=p.sizes?Object.keys(p.sizes)[0]:0;
  it.innerHTML = (p.img?`<div class="shadow" style="left:${S.x}%;top:${S.base}%"></div><img class="photo" src="${p.img}" alt="${p.name}" draggable="false" style="left:${S.x}%;top:${S.base}%">`:'')
    + `<div class="price" style="left:${S.x}%;top:${S.price}%">${p.soon?'SOON':CONFIG.currency+p.sizes[first]}</div>`
    + (p.soon?'':`<button class="hit" aria-label="${p.name}" style="left:${S.x-S.w/2}%;top:${S.base-25}%;width:${S.w}%;height:${S.bottom-S.base+25}%"></button>`);
  if(!p.soon) it.querySelector('.hit').addEventListener('click',()=>openProduct(p.id));
  caseEl.appendChild(it);
});
caseEl.insertAdjacentHTML('beforeend','<div class="night" id="night"></div><div class="beam" id="beam"></div><div class="lamp" id="lamp"></div>');

/* ---- product zoom ---- */
function openProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p||p.soon) return;
  current = p; size = +Object.keys(p.sizes)[0];
  const it = document.querySelector(`.item[data-id="${id}"]`);
  const app = $('#app').getBoundingClientRect(), cr = caseEl.getBoundingClientRect(), br = it.querySelector('.photo').getBoundingClientRect();
  const W = app.width, H = app.height;
  const px = br.left-cr.left+br.width/2, py = br.top-cr.top+br.height/2;       // bottle centre inside the stage
  const s = Math.min(H*0.34/br.height, W*0.7/br.width, 4);
  const tx = (W/2) - (cr.left-app.left) - px*s, ty = (H*0.32) - (cr.top-app.top) - py*s;
  const S=SLOTS[p.slot], top=S.lamp[1], bot=S.bottom, st=caseEl.style;
  st.setProperty('--cx',S.x+'%'); st.setProperty('--cy',((top+bot)/2)+'%'); st.setProperty('--rx','25%'); st.setProperty('--ry',((bot-top)/2*1.12)+'%');
  const beam=$('#beam').style; beam.left=S.lamp[0]+'%'; beam.top=S.lamp[1]+'%'; beam.width="36%"; beam.height=(S.bottom-S.lamp[1])+'%';
  const lamp=$('#lamp').style; lamp.left=S.lamp[0]+'%'; lamp.top=S.lamp[1]+'%';
  document.querySelectorAll('.item').forEach(n=>n.classList.toggle('sel',n===it));
  caseEl.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  caseEl.classList.add('zoom'); dim.classList.add('on'); $('#hint').classList.add('off');
  $('#pNo').textContent = `${p.no} · Eau de parfum`;
  $('#pName').textContent = p.name;
  $('#pNotes').innerHTML = p.notes.map(n=>`<span>${n}</span>`).join('');
  renderSizes(); panel.classList.add('on');
}
function closeProduct(){
  caseEl.style.transform=''; caseEl.classList.remove('zoom'); dim.classList.remove('on'); panel.classList.remove('on'); $('#hint').classList.remove('off'); current=null;
}
function renderSizes(){
  const p=current, c=CONFIG.currency;
  $('#pSizes').innerHTML = Object.keys(p.sizes).map(sz=>
    `<button class="size ${+sz===size?'on':''}" data-s="${sz}"><span>${sz} ml</span><span>${c}${p.sizes[sz]}</span></button>`).join('');
  $('#pSizes').querySelectorAll('.size').forEach(b=>b.onclick=()=>{size=+b.dataset.s;renderSizes();});
  $('#addBtn').innerHTML = `Add to bag <span class="dot">·</span> ${c}${p.sizes[size]}`;
}
$('#closeP').onclick = closeProduct;
$('#addBtn').onclick = ()=>{
  const f = bag.find(l=>l.id===current.id && l.size===size);
  f ? f.qty++ : bag.push({id:current.id,size,qty:1});
  saveBag(); toast(`${current.name} added`);
};

/* ---- bag ---- */
const money = n => CONFIG.currency + n;
function saveBag(){ try{localStorage.setItem('aloura-bag',JSON.stringify(bag));}catch(e){} renderBag(); }
function orderText(){
  const ls = bag.map(l=>{const p=PRODUCTS.find(x=>x.id===l.id);return `${l.qty} × ${p.name} ${l.size}ml — ${money(p.sizes[l.size]*l.qty)}`;});
  return `ALOURA order\n${ls.join('\n')}\nTotal: ${money(bag.reduce((t,l)=>t+PRODUCTS.find(x=>x.id===l.id).sizes[l.size]*l.qty,0))}`;
}
function renderBag(){
  const count = bag.reduce((t,l)=>t+l.qty,0);
  $('#badge').textContent=count; $('#badge').classList.toggle('on',count>0);
  const total = bag.reduce((t,l)=>t+PRODUCTS.find(x=>x.id===l.id).sizes[l.size]*l.qty,0);
  $('#total').textContent = money(total);
  $('#lines').innerHTML = bag.length ? bag.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.id);return `
    <div class="line"><div><b>${p.name}</b><br><small>${p.no} · ${l.size} ml</small>
      <div class="qty"><button data-i="${i}" data-d="-1" aria-label="Less">−</button>${l.qty}<button data-i="${i}" data-d="1" aria-label="More">+</button></div></div>
      <b>${money(p.sizes[l.size]*l.qty)}</b></div>`;}).join('')
    : `<div class="empty">Your bag is empty.<br>Tap a bottle to begin.</div>`;
  $('#lines').querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{
    const l=bag[+b.dataset.i]; l.qty+=+b.dataset.d; if(l.qty<1) bag.splice(+b.dataset.i,1); saveBag(); });
  const wa=$('#waLink');
  if(CONFIG.whatsapp && bag.length){ wa.style.display='block'; wa.href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(orderText())}`; }
  else wa.style.display='none';
  $('#copyOrder').style.display = bag.length?'block':'none';
}
$('#copyOrder').onclick = async()=>{
  try{ await navigator.clipboard.writeText(orderText()); toast('Order summary copied'); }
  catch(e){ toast('Copy not available here'); }
};

/* ---- sheets, toast ---- */
const sheet = (id,on)=>$(id).classList.toggle('on',on);
$('#bagBtn').onclick = ()=>sheet('#bagSheet',true);
$('#menuBtn').onclick = ()=>sheet('#menuSheet',true);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{sheet('#bagSheet',false);sheet('#menuSheet',false);}));
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800);}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeProduct();sheet('#bagSheet',false);sheet('#menuSheet',false);} });
renderBag();
</script>
</body>
</html>
