<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALOURA — Eau de Parfum</title>
<meta name="description" content="ALOURA — eau de parfum. Paiement à la livraison en Algérie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@200;300;400;500&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0807;--ink:#efe6dc;--muted:#a89d93;--gold:#d9bf8c;--cream:#e9dcc3;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#1d1420 0%,var(--bg) 60%);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-weight:300}
html[dir=rtl] body{font-family:Tajawal,Manrope,sans-serif}
button,a{font:inherit;color:inherit;cursor:pointer}
button{background:none;border:0}
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 20px 0;max-width:1000px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(30,22,36,.55);text-decoration:none;font-size:13px;letter-spacing:.06em}
.back:hover{border-color:var(--gold)}
.lang{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(30,22,36,.55);display:grid;place-items:center}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px;display:grid;gap:28px;align-items:center}
@media(min-width:800px){.wrap{grid-template-columns:1fr 1fr;gap:56px;padding-top:40px}}
.pic{display:grid;place-items:center;padding:20px}
.pic img{width:min(300px,70%);height:auto;filter:drop-shadow(0 24px 30px rgba(0,0,0,.7))}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,7vw,64px);margin:8px 0 6px;letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.notes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.notes span{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.sizes{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.size{display:flex;gap:14px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(30,22,36,.4)}
.size.on{border-color:var(--gold);color:var(--gold)}
.add{width:100%;padding:18px;border-radius:16px;background:var(--cream);color:#1a1320;font-weight:500;letter-spacing:.06em}
.go{display:none;margin-top:12px;width:100%;padding:16px;border-radius:16px;border:1px solid var(--gold);background:none;color:var(--gold);text-align:center;text-decoration:none}
.go.on{display:block}
.pay{margin-top:18px;color:var(--muted);font-size:13px}
.missing{max-width:520px;margin:18vh auto;text-align:center;padding:0 20px;display:grid;gap:22px;justify-items:center}

.gal{display:grid;gap:14px;justify-items:center}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.thumbs button{width:64px;height:64px;border:1px solid var(--line);border-radius:12px;background:rgba(30,22,36,.4);padding:4px;opacity:.7}
.thumbs button.on{border-color:var(--gold);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:contain}
.desc{color:#d8cdc2;line-height:1.7;font-size:15px;margin-bottom:24px}
.sec2{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
.sec2 h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:26px;margin-bottom:16px}
.fields{display:grid;gap:12px}
.fields label{display:grid;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.fields input,.fields select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(30,22,36,.55);color:var(--ink);font:inherit;font-size:16px}
.fields .bad{border-color:#e0707a}
.qty{display:inline-flex;align-items:center;gap:14px;margin-bottom:6px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:18px}
.sums{margin:18px 0;display:grid;gap:8px;font-size:14px}
.sums div{display:flex;justify-content:space-between}
.sums .tot{font-weight:500;color:var(--cream);font-size:16px;border-top:1px solid var(--line);padding-top:10px}
.buy2{border:0;width:100%;padding:18px;border-radius:16px;background:var(--cream);color:#1a1320;font-weight:500;letter-spacing:.06em}
.buy2:disabled{opacity:.6}
.alt{width:100%;margin-top:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:none}
.done{padding:18px;border:1px solid var(--gold);border-radius:16px;display:grid;gap:12px}
.done pre{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2030;border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="/" id="back"></a>
  <button class="lang" id="langBtn" type="button"></button>
</div>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script src="/products.js"></script>
<script>
const I18N={
  fr:{cur:"DA",ml:"ml",edp:"Eau de parfum",gm:"Pour homme",gf:"Pour femme",back:"← Retour à la boutique",add:"Ajouter au panier",viewBag:"Voir mon panier et commander",added:"Ajouté au panier",cod:"Paiement à la livraison · en espèces à la réception",langBtn:"ع",nf:"Ce parfum n'existe pas (ou pas encore).",soonT:"Bientôt",order:"Commander maintenant",qty:"Quantité",coTitle:"Informations de livraison",fName:"Nom complet",phName:"Votre nom complet",fPhone:"Téléphone",fWilaya:"Wilaya",wChoose:"Choisissez votre wilaya",fAddr:"Commune et adresse",phAddr:"Commune, rue, bâtiment",fNote:"Note (facultatif)",phNote:"Instructions de livraison",subtotal:"Sous-total",delivery:"Livraison",total:"Total",byPhone:"Confirmée par téléphone",plusDelivery:" + livraison",confirm:"Confirmer la commande",badPhone:"Numéro invalide : 05, 06 ou 07 + 8 chiffres",badField:"Veuillez compléter le champ en rouge",okT:"Commande reçue",okM:"Merci{id}. Nous vous appellerons au {phone} pour confirmer la livraison. Vous payez à la réception.",okId:" — commande {id}",failT:"Commande non envoyée",failM:"Nous n'avons pas pu joindre notre système de commande : cette commande n'a PAS été envoyée. Copiez le récapitulatif et envoyez-le-nous.",copy:"Copier le récapitulatif",copied:"Récapitulatif copié",free:"Gratuite"},
  ar:{cur:"دج",ml:"مل",edp:"ماء عطر",gm:"للرجال",gf:"للنساء",back:"→ العودة إلى المتجر",add:"أضف إلى السلة",viewBag:"عرض السلة وإتمام الطلب",added:"تمت الإضافة إلى السلة",cod:"الدفع عند الاستلام · نقدًا عند وصول طلبك",langBtn:"FR",nf:"هذا العطر غير موجود (أو لم يصدر بعد).",soonT:"قريبًا",order:"اطلب الآن",qty:"الكمية",coTitle:"معلومات التوصيل",fName:"الاسم الكامل",phName:"اسمك الكامل",fPhone:"الهاتف",fWilaya:"الولاية",wChoose:"اختر ولايتك",fAddr:"البلدية والعنوان",phAddr:"البلدية، الشارع، العمارة",fNote:"ملاحظة (اختياري)",phNote:"تعليمات التوصيل",subtotal:"المجموع الفرعي",delivery:"التوصيل",total:"المجموع",byPhone:"يُؤكَّد عبر الهاتف",plusDelivery:" + التوصيل",confirm:"تأكيد الطلب",badPhone:"رقم غير صالح: 05 أو 06 أو 07 متبوعًا بـ 8 أرقام",badField:"يرجى إكمال الحقل المحدد",okT:"تم استلام طلبك",okM:"شكرًا{id}. سنتصل بك على {phone} لتأكيد التوصيل. تدفع عند الاستلام.",okId:" — رقم الطلب {id}",failT:"لم يُرسل الطلب",failM:"تعذّر الاتصال بنظام الطلبات، لذلك لم يُرسل طلبك. انسخ الملخص وأرسله إلينا.",copy:"نسخ ملخص الطلب",copied:"تم نسخ الملخص",free:"مجاني"}
};
let LANG; try{LANG=localStorage.getItem('aloura-lang');}catch(_){}
if(!I18N[LANG]) LANG=/^ar/i.test(navigator.language||'')?'ar':'fr';
const t=k=>I18N[LANG][k];
const slugOf=p=>p.name.toLowerCase().replace(/[^a-z0-9]+/g,'');
const numSlug=p=>'aloura'+String(p.id).padStart(2,'0');   // old alias: aloura01
const money=n=>Number(n).toLocaleString('fr-FR').replace(/[  \s]/g,' ')+' '+t('cur');
const m=location.pathname.match(/^\/product\/([^\/]+)\/?$/i), key=m&&m[1].toLowerCase();
const p=PRODUCTS.find(x=>!x.soon&&[slugOf(x),numSlug(x)].includes(key));
let size=p?+Object.keys(p.sizes)[0]:0, added=false, qty=1, shot=0, showForm=true, cust={}, result=null;
try{cust=JSON.parse(localStorage.getItem('aloura-cust')||'{}');}catch(_){}
const feeFor=w=>(w&&DELIVERY.byWilaya[w]!=null)?DELIVERY.byWilaya[w]:DELIVERY.fee;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000);}
const normPhone=v=>{v=v.replace(/[\s.\-()]/g,'');if(v.startsWith('+213'))v='0'+v.slice(4);else if(v.startsWith('00213'))v='0'+v.slice(5);else if(/^213\d{9}$/.test(v))v='0'+v.slice(3);return v;};
const $=s=>document.querySelector(s);
function render(){
  if(document.getElementById('co')) cust=Object.assign(cust,{name:$('#fName').value,phone:$('#fPhone').value,wilaya:$('#fWilaya').value,addr:$('#fAddr').value,note:$('#fNote').value});   // keep what was typed
  const h=document.documentElement; h.lang=LANG; h.dir=LANG==='ar'?'rtl':'ltr';
  $('#back').textContent=t('back'); $('#langBtn').textContent=t('langBtn');
  if(!p){ document.title='ALOURA'; $('#main').innerHTML=`<div class="missing"><p>${t('nf')}</p></div>`; return; }
  document.title=p.name+' — ALOURA';
  const nn=n=>NOTES[n]?NOTES[n][LANG]:n;
  const pics=(p.gallery&&p.gallery.length?p.gallery:[p.img]); if(shot>=pics.length) shot=0;
  const desc=(p.desc&&(p.desc[LANG]||p.desc.fr))||'';
  const w=cust.wilaya||'', fee=feeFor(w), sub=p.sizes[size]*qty;
  const sums=`<div><span>${t('subtotal')}</span><span>${money(sub)}</span></div><div><span>${t('delivery')}</span><span>${fee==null?t('byPhone'):fee===0?t('free'):money(fee)}</span></div><div class="tot"><span>${t('total')}</span><span>${money(sub+(fee||0))}${fee==null?t('plusDelivery'):''}</span></div>`;
  const form=showForm&&!result?`<form class="sec2" id="co" novalidate>
      <h2>${t('coTitle')}</h2>
      <div class="fields">
        <label>${t('fName')}<input id="fName" autocomplete="name" placeholder="${t('phName')}" value="${cust.name||''}"></label>
        <label>${t('fPhone')}<input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05 / 06 / 07 …" value="${cust.phone||''}"></label>
        <label>${t('fWilaya')}<select id="fWilaya"><option value="">${t('wChoose')}</option>${WILAYAS.map((x,i)=>`<option value="${x}" ${x===w?'selected':''}>${String(i+1).padStart(2,'0')} · ${x}</option>`).join('')}</select></label>
        <label>${t('fAddr')}<input id="fAddr" autocomplete="street-address" placeholder="${t('phAddr')}" value="${cust.addr||''}"></label>
        <label>${t('fNote')}<input id="fNote" placeholder="${t('phNote')}" value="${cust.note||''}"></label>
        <input id="fHp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0">
      </div>
      <div class="sums" id="sums">${sums}</div>
      <button class="buy2" type="submit" id="confirm">${t('confirm')}</button>
    </form>`:'';
  const doneBox=result?`<div class="sec2 done"><h2>${result.ok?t('okT'):t('failT')}</h2><p>${result.msg}</p><pre>${result.text}</pre><button class="alt" id="cp">${t('copy')}</button></div>`:'';
  $('#main').innerHTML=`<div class="wrap">
    <div class="gal"><div class="pic"><img src="${pics[shot]}" alt="${p.name}"></div>
      ${pics.length>1?`<div class="thumbs">${pics.map((u,i)=>`<button data-g="${i}" class="${i===shot?'on':''}" aria-label="${p.name} ${i+1}"><img src="${u}" alt=""></button>`).join('')}</div>`:''}</div>
    <div>
      <div class="eyebrow">${p.no}</div><h1>${p.name}</h1>
      <div class="sub">${t('edp')} · ${t(p.gender==='f'?'gf':'gm')}</div>
      ${desc?`<p class="desc">${desc}</p>`:''}
      <div class="notes">${p.notes.map(n=>`<span>${nn(n)}</span>`).join('')}</div>
      <div class="sizes">${Object.keys(p.sizes).map(sz=>`<button class="size ${+sz===size?'on':''}" data-s="${sz}"><span>${sz} ${t('ml')}</span><span>${money(p.sizes[sz])}</span></button>`).join('')}</div>
      <div class="qty"><span>${t('qty')}</span><button id="qm" type="button">−</button><b>${qty}</b><button id="qp" type="button">+</button></div>
      <button class="buy2" id="order" style="margin-top:12px">${t('order')} · ${money(sub)}</button>
      <div class="pay">${t('cod')}</div>
      ${form}${doneBox}
    </div></div>`;
  document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{size=+b.dataset.s;added=false;render();});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{shot=+b.dataset.g;render();});
  $('#qm').onclick=()=>{qty=Math.max(1,qty-1);render();}; $('#qp').onclick=()=>{qty=Math.min(20,qty+1);render();};
  $('#order').onclick=()=>{ const f=$('#co')||document.querySelector('.done'); if(f) f.scrollIntoView({behavior:'smooth',block:'start'}); };
  if($('#co')&&!window._ic){ window._ic=1; try{if(window.fbq)fbq('track','InitiateCheckout',{value:sub,currency:'DZD'});}catch(_){} }
  if($('#co')){
    $('#fWilaya').onchange=e=>{cust.wilaya=e.target.value; $('#sums').innerHTML=sumsFor();};
    function sumsFor(){const f=feeFor($('#fWilaya').value);return `<div><span>${t('subtotal')}</span><span>${money(sub)}</span></div><div><span>${t('delivery')}</span><span>${f==null?t('byPhone'):f===0?t('free'):money(f)}</span></div><div class="tot"><span>${t('total')}</span><span>${money(sub+(f||0))}${f==null?t('plusDelivery'):''}</span></div>`;}
    document.querySelectorAll('.fields input,.fields select').forEach(el=>el.addEventListener('input',()=>el.classList.remove('bad')));
    $('#co').addEventListener('submit',submitOrder);
  }
  if($('#cp')) $('#cp').onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(result.text):Promise.reject()).then(()=>toast(t('copied')),()=>{}); };
}
async function submitOrder(e){
  e.preventDefault();
  const c={name:$('#fName').value.trim(),phone:normPhone($('#fPhone').value),wilaya:$('#fWilaya').value,addr:$('#fAddr').value.trim(),note:$('#fNote').value.trim()};
  ['fName','fPhone','fWilaya','fAddr'].forEach(id=>$('#'+id).classList.remove('bad'));
  const bad=[c.name.length<2&&'fName',!/^0[567]\d{8}$/.test(c.phone)&&'fPhone',!c.wilaya&&'fWilaya',c.addr.length<5&&'fAddr'].filter(Boolean);
  if(bad.length){bad.forEach(id=>$('#'+id).classList.add('bad'));$('#'+bad[0]).focus();return toast(bad[0]==='fPhone'?t('badPhone'):t('badField'));}
  cust=c; try{localStorage.setItem('aloura-cust',JSON.stringify(c));}catch(_){}
  const fee=feeFor(c.wilaya), unitP=p.sizes[size], sub=unitP*qty, btn=$('#confirm'); btn.disabled=true;
  const text=`ALOURA — ${qty} × ${p.name} ${size}ml — ${money(sub)}\nNom : ${c.name}\nTéléphone : ${c.phone}\nWilaya : ${c.wilaya}\nAdresse : ${c.addr}`+(c.note?`\nNote : ${c.note}`:'')+`\nLivraison : ${fee==null?'à confirmer':money(fee)}\nPaiement à la livraison`;
  let sent=false,id='';
  try{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:c,items:[{product:p.name,size,qty,unitPrice:unitP}],subtotal:sub,delivery:fee,payment:'cash_on_delivery',hp:$('#fHp').value})});
    const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw 0; sent=true; id=j.id||'';}catch(_){}
  if(sent){ try{if(window.fbq)fbq('track','Purchase',{value:sub+(fee||0),currency:'DZD',content_type:'product',content_ids:[String(p.id)],num_items:qty});}catch(_){}
    result={ok:true,text,msg:t('okM').replace('{id}',id?t('okId').replace('{id}',id):'').replace('{phone}',c.phone)}; }
  else result={ok:false,text,msg:t('failM')};
  render(); $('#main').querySelector('.done').scrollIntoView({behavior:'smooth',block:'center'});
}
$('#langBtn').onclick=()=>{LANG=LANG==='fr'?'ar':'fr'; try{localStorage.setItem('aloura-lang',LANG);}catch(_){} render();};
render();
try{if(p&&window.fbq)fbq('track','ViewContent',{content_name:p.name,content_ids:[String(p.id)],content_type:'product'});}catch(_){}
</script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
