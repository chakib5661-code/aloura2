<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALOURA — Eau de Parfum</title>
<meta name="description" content="ALOURA — eau de parfum. Paiement à la livraison en Algérie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--surface:#1C1C1C;--ink:#F5EFE6;--muted:#A8A29E;--gold:#C9A55C;--cream:#C9A55C;--line:rgba(201,165,92,.28)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:radial-gradient(120% 70% at 50% 0%,#1C1C1C 0%,var(--bg) 65%);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:300}
html[dir=rtl] body{font-family:Tajawal,Inter,sans-serif}
button,a{font:inherit;color:inherit;cursor:pointer}
button{background:none;border:0}
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 20px 0;max-width:1000px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(28,28,28,.8);text-decoration:none;font-size:13px;letter-spacing:.06em}
.back:hover{border-color:var(--gold)}
.lang{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(28,28,28,.8);display:grid;place-items:center}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px;display:grid;gap:28px;grid-template-areas:"gal" "info" "rev"}
.gal{grid-area:gal}.info{grid-area:info}.rev{grid-area:rev}
@media(min-width:800px){.wrap{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:28px 56px;padding-top:40px;grid-template-areas:"gal info" "rev info"}.gal{align-self:center}}
.rev h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:26px;margin-bottom:14px}
.rev .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rev .shots button{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#1C1C1C;padding:0;line-height:0}
.rev .shots img{width:100%;height:auto}
.more{max-width:640px;margin:0 auto;padding:0 20px 60px;display:grid;gap:18px}
.more img{width:100%;height:auto;border-radius:18px;display:block}
.pitch{max-width:640px;margin:0 auto;padding:10px 20px 40px;display:grid;gap:18px}
.pitch article{padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:#1C1C1C}
.pitch h3{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:22px;color:var(--gold);margin-bottom:6px}
.pitch p{color:#A8A29E;line-height:1.7;font-size:15px}
.faq{max-width:640px;margin:0 auto;padding:10px 20px 70px}
.faq h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:28px;margin-bottom:14px}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--gold)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin-top:10px;color:#A8A29E;line-height:1.7;font-size:15px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:20px;z-index:10}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.pic{display:grid;place-items:center;padding:20px}
.pic img{width:min(300px,70%);height:auto;filter:drop-shadow(0 24px 30px rgba(0,0,0,.7))}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,7vw,64px);margin:8px 0 6px;letter-spacing:.04em}
.sub{display:block;width:fit-content;max-width:100%;color:var(--ink);font-size:clamp(14px,4vw,17px);font-weight:600;line-height:1.4;letter-spacing:.01em;padding:10px 14px;border:1.5px solid var(--gold);border-radius:14px;background:transparent;margin-bottom:20px}
.notes{display:flex;flex-wrap:nowrap;gap:6px;margin-bottom:26px}
.notes span{padding:10px 12px;border:1.5px solid var(--gold);border-radius:999px;white-space:nowrap;font-size:clamp(12.5px,3.9vw,16px);font-weight:600;color:var(--ink);background:transparent;letter-spacing:.01em;line-height:1.2}
.sizes{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.size{display:flex;gap:14px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:#1C1C1C}
.size.on{border-color:var(--gold);color:var(--gold)}
.add{width:100%;padding:18px;border-radius:16px;background:var(--gold);color:#101010;font-weight:500;letter-spacing:.06em}
.go{display:none;margin-top:12px;width:100%;padding:16px;border-radius:16px;border:1px solid var(--gold);background:none;color:var(--gold);text-align:center;text-decoration:none}
.go.on{display:block}
.pay{margin-top:18px;padding:12px 14px;border:1.5px solid var(--gold);border-radius:14px;background:transparent;color:var(--ink);font-size:clamp(14px,4vw,16px);font-weight:600;line-height:1.4;text-align:center;letter-spacing:.01em}
.missing{max-width:520px;margin:18vh auto;text-align:center;padding:0 20px;display:grid;gap:22px;justify-items:center}

.gal{display:grid;gap:14px;justify-items:center}
.pic img.photo{width:min(440px,100%);border-radius:18px;filter:none;box-shadow:0 20px 40px rgba(0,0,0,.55)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.thumbs button{width:64px;height:64px;border:1px solid var(--line);border-radius:12px;background:#1C1C1C;padding:4px;opacity:.7}
.thumbs button.on{border-color:var(--gold);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:contain}
.desc{color:#A8A29E;line-height:1.7;font-size:15px;margin-bottom:24px}
.sec2{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
.sec2 h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:26px;margin-bottom:16px}
.fields{display:grid;gap:12px}
.fields label{display:grid;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.fields input,.fields select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(28,28,28,.8);color:var(--ink);font:inherit;font-size:16px}
.fields .bad{border-color:#e0707a}
.qty{display:inline-flex;align-items:center;gap:14px;margin-bottom:6px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:18px}
.sums{margin:18px 0;display:grid;gap:8px;font-size:14px}
.sums div{display:flex;justify-content:space-between}
.sums .tot{font-weight:500;color:var(--cream);font-size:16px;border-top:1px solid var(--line);padding-top:10px}
.buy2{border:0;width:100%;padding:18px;border-radius:16px;background:var(--gold);color:#101010;font-weight:500;letter-spacing:.06em}
.buy2:disabled{opacity:.6}
.alt{width:100%;margin-top:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:none}
.done{padding:18px;border:1px solid var(--gold);border-radius:16px;display:grid;gap:12px}
.done pre{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#101010;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.sub,.pay,.notes span{border-width:1px;font-weight:500;color:var(--ink)}.add,.buy2{transition:background .3s}.add:hover,.buy2:hover{background:#d8b878}.fields input,.fields select{background:#1C1C1C}

/* ===== Aloura Rouge: ivory / blush / plum / champagne (feminine collection only) ===== */
body.g-f{--bg:#F8F3EF;--surface:#FFFFFF;--ink:#291B25;--muted:#6F5B67;--gold:#C5A36A;--cream:#C5A36A;--plum:#651B45;--blush:#E9C5CE;--line:rgba(197,163,106,.45);
  background:linear-gradient(180deg,#F8F3EF 0%,#F8F3EF 55%,#F3E4E6 100%);color:var(--ink)}
html:has(body.g-f){background:#F8F3EF}
body.g-f .bar,body.g-f .wrap{max-width:1080px}
body.g-f .back,body.g-f .lang{background:rgba(255,255,255,.75);border-color:var(--line);color:var(--ink);box-shadow:0 6px 18px rgba(101,27,69,.07);transition:border-color .3s,box-shadow .3s}
body.g-f .back:hover,body.g-f .lang:hover{border-color:var(--gold);box-shadow:0 8px 22px rgba(101,27,69,.12)}
body.g-f .wrap{padding-top:36px;gap:36px}
@media(min-width:800px){body.g-f .wrap{gap:36px 80px;padding-top:56px}}
body.g-f .pic{background:none;padding:28px 20px;width:100%}
body.g-f .pic img{filter:drop-shadow(0 26px 24px rgba(101,27,69,.28));animation:rf .9s cubic-bezier(.2,.8,.2,1) both}
body.g-f .pic img.photo{border-radius:18px;box-shadow:0 20px 40px rgba(101,27,69,.2);width:min(440px,100%)}
@keyframes rf{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.g-f .thumbs button{background:#fff;border-color:rgba(197,163,106,.35);opacity:.8;transition:all .3s}
body.g-f .thumbs button:hover{opacity:1;transform:translateY(-2px)}
body.g-f .thumbs button.on{border-color:var(--gold);opacity:1;box-shadow:0 6px 16px rgba(197,163,106,.35)}
body.g-f .eyebrow{color:var(--gold);letter-spacing:.38em;font-weight:500}
body.g-f h1{font-weight:300;color:var(--ink);letter-spacing:.06em;margin:12px 0 14px;position:relative;padding-bottom:20px}
body.g-f h1::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:1px;background:var(--gold)}
html[dir=rtl] body.g-f h1::after{left:auto;right:0}
body.g-f .sub,body.g-f .pay{border-color:var(--gold);color:var(--plum);background:rgba(233,197,206,.28);font-weight:500;border-width:1px}
body.g-f .notes span{border:1px solid var(--gold);color:var(--ink);background:#fff;font-weight:500;box-shadow:0 4px 10px rgba(197,163,106,.15)}
body.g-f .desc,body.g-f .pitch p,body.g-f .faq details p{color:#5B4854}
body.g-f .size{background:#fff;border-color:var(--line);color:var(--ink)}
body.g-f .size.on{border-color:var(--plum);color:var(--plum);background:rgba(233,197,206,.35)}
body.g-f .add,body.g-f .buy2{background:var(--plum);color:#F8F3EF;border:1px solid var(--plum);box-shadow:0 12px 26px rgba(101,27,69,.28);letter-spacing:.12em;text-transform:uppercase;font-size:14px;transition:background .3s,transform .25s,box-shadow .3s}
body.g-f .add:hover,body.g-f .buy2:hover{background:#7A2455;transform:translateY(-2px);box-shadow:0 16px 32px rgba(101,27,69,.34)}
body.g-f .buy2:active{transform:none}
body.g-f .go{border-color:var(--plum);color:var(--plum)}
body.g-f .qty button{background:#fff;border-color:var(--line);color:var(--plum)}
body.g-f .sec2{border-top-color:var(--line)}
body.g-f .sec2 h2,body.g-f .rev h2,body.g-f .faq h2{color:var(--ink)}
body.g-f .fields label{color:var(--muted)}
body.g-f .fields input,body.g-f .fields select{background:#fff;border-color:rgba(197,163,106,.5);color:var(--ink);transition:border-color .3s,box-shadow .3s}
body.g-f .fields input:focus,body.g-f .fields select:focus{outline:0;border-color:var(--plum);box-shadow:0 0 0 3px rgba(233,197,206,.7)}
body.g-f .fields .bad{border-color:#B3263E}
body.g-f .sums .tot{color:var(--plum)}
body.g-f .alt{border-color:var(--line);color:var(--ink)}
body.g-f .done{border-color:var(--gold);background:#fff}
body.g-f .toast{background:var(--plum);color:#F8F3EF}
body.g-f .more{max-width:720px;padding-bottom:70px}
body.g-f .more img{border-radius:24px;box-shadow:0 24px 50px rgba(101,27,69,.16)}
body.g-f .pitch{max-width:720px;gap:20px}
body.g-f .pitch article{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 28px;box-shadow:0 14px 34px rgba(101,27,69,.07);transition:transform .4s,box-shadow .4s}
body.g-f .pitch article:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(101,27,69,.12)}
body.g-f .pitch h3{color:var(--plum);font-size:25px}
body.g-f .faq{max-width:720px}
body.g-f .faq details{border-bottom-color:var(--line)}
body.g-f .faq summary::after{color:var(--gold);font-size:20px}
body.g-f .rev .shots button{background:#fff;border-color:var(--line)}
@media(prefers-reduced-motion:reduce){body.g-f *{animation:none!important;transition:none!important}}
</style>

<body>
<div class="bar">
  <a class="back" href="/" id="back"></a>
  <button class="lang" id="langBtn" type="button"></button>
</div>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script src="/products.js"></script>
<script>
const I18N={
  fr:{cur:"DA",ml:"ml",edp:"Eau de parfum",gm:"pour homme",gf:"pour femme",gb:"pour homme et pour femme",back:"← Retour à la boutique",add:"Ajouter au panier",viewBag:"Voir mon panier et commander",added:"Ajouté au panier",cod:"Paiement à la livraison · en espèces à la réception",langBtn:"ع",nf:"Ce parfum n'existe pas (ou pas encore).",soonT:"Bientôt",reviews:"Avis de nos clients",faqT:"Questions fréquentes",order:"Commander maintenant",qty:"Quantité",coTitle:"Informations de livraison",fName:"Nom complet",phName:"Votre nom complet",fPhone:"Téléphone",fWilaya:"Wilaya",wChoose:"Choisissez votre wilaya",fAddr:"Commune et adresse (facultatif)",phAddr:"Commune, rue, bâtiment",subtotal:"Sous-total",delivery:"Livraison",total:"Total",byPhone:"Confirmée par téléphone",plusDelivery:" + livraison",confirm:"Confirmer la commande",badPhone:"Numéro invalide : 05, 06 ou 07 + 8 chiffres",badField:"Veuillez compléter le champ en rouge",okT:"Commande reçue",okM:"Merci{id}. Nous vous appellerons au {phone} pour confirmer la livraison. Vous payez à la réception.",okId:" — commande {id}",failT:"Commande non envoyée",failM:"Nous n'avons pas pu joindre notre système de commande : cette commande n'a PAS été envoyée. Copiez le récapitulatif et envoyez-le-nous.",copy:"Copier le récapitulatif",copied:"Récapitulatif copié",free:"Gratuite"},
  ar:{cur:"دج",ml:"مل",edp:"ماء عطر",gm:"للرجال",gf:"للنساء",gb:"للرجال والنساء",back:"→ العودة إلى المتجر",add:"أضف إلى السلة",viewBag:"عرض السلة وإتمام الطلب",added:"تمت الإضافة إلى السلة",cod:"الدفع عند الاستلام · نقدًا عند وصول طلبك",langBtn:"FR",nf:"هذا العطر غير موجود (أو لم يصدر بعد).",soonT:"قريبًا",reviews:"آراء زبائننا",faqT:"الأسئلة الأكثر شيوعًا",order:"اطلب الآن",qty:"الكمية",coTitle:"معلومات التوصيل",fName:"الاسم الكامل",phName:"اسمك الكامل",fPhone:"الهاتف",fWilaya:"الولاية",wChoose:"اختر ولايتك",fAddr:"البلدية والعنوان (اختياري)",phAddr:"البلدية، الشارع، العمارة",subtotal:"المجموع الفرعي",delivery:"التوصيل",total:"المجموع",byPhone:"يُؤكَّد عبر الهاتف",plusDelivery:" + التوصيل",confirm:"تأكيد الطلب",badPhone:"رقم غير صالح: 05 أو 06 أو 07 متبوعًا بـ 8 أرقام",badField:"يرجى إكمال الحقل المحدد",okT:"تم استلام طلبك",okM:"شكرًا{id}. سنتصل بك على {phone} لتأكيد التوصيل. تدفع عند الاستلام.",okId:" — رقم الطلب {id}",failT:"لم يُرسل الطلب",failM:"تعذّر الاتصال بنظام الطلبات، لذلك لم يُرسل طلبك. انسخ الملخص وأرسله إلينا.",copy:"نسخ ملخص الطلب",copied:"تم نسخ الملخص",free:"مجاني"}
};
let LANG; try{LANG=localStorage.getItem('aloura-lang');}catch(_){}
if(!I18N[LANG]) LANG=/^ar/i.test(navigator.language||'')?'ar':'fr';
const t=k=>I18N[LANG][k];
const slugOf=p=>p.name.toLowerCase().replace(/[^a-z0-9]+/g,'');
const numSlug=p=>'aloura'+String(p.id).padStart(2,'0');   // old alias: aloura01
const money=n=>Number(n).toLocaleString('fr-FR').replace(/[  \s]/g,' ')+' '+t('cur');
const m=location.pathname.match(/^\/product\/([^\/]+)\/?$/i), key=m&&m[1].toLowerCase();
const p=PRODUCTS.find(x=>!x.soon&&[slugOf(x),numSlug(x)].includes(key));
let size=p?+Object.keys(p.sizes)[0]:0, added=false, qty=1, shot=0, showForm=true, cust={}, result=null;
try{cust=JSON.parse(localStorage.getItem('aloura-cust')||'{}');}catch(_){}
const feeFor=w=>(w&&DELIVERY.byWilaya[w]!=null)?DELIVERY.byWilaya[w]:DELIVERY.fee;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000);}
const normPhone=v=>{v=v.replace(/[\s.\-()]/g,'');if(v.startsWith('+213'))v='0'+v.slice(4);else if(v.startsWith('00213'))v='0'+v.slice(5);else if(/^213\d{9}$/.test(v))v='0'+v.slice(3);return v;};
const $=s=>document.querySelector(s);
function render(){
  if(document.getElementById('co')) cust=Object.assign(cust,{name:$('#fName').value,phone:$('#fPhone').value,wilaya:$('#fWilaya').value,addr:$('#fAddr').value});   // keep what was typed
  const h=document.documentElement; h.lang=LANG; h.dir=LANG==='ar'?'rtl':'ltr';
  $('#back').textContent=t('back'); $('#langBtn').textContent=t('langBtn');
  if(!p){ document.title='ALOURA'; $('#main').innerHTML=`<div class="missing"><p>${t('nf')}</p></div>`; return; }
  document.title=p.name+' — ALOURA'; document.body.classList.toggle('g-f',p.gender==='f');
  const nn=n=>NOTES[n]?NOTES[n][LANG]:n;
  const pics=(p.gallery&&p.gallery.length?p.gallery:[p.img]); if(shot>=pics.length) shot=0;
  const shots=[...(typeof REVIEWS!=='undefined'?REVIEWS:[]),...(p.reviews||[])];   // customer review screenshots
  const pitch=(p.pitch&&(p.pitch[LANG]||p.pitch.fr))||[];
  const desc=(p.desc&&(p.desc[LANG]||p.desc.fr))||'';
  const w=cust.wilaya||'', fee=feeFor(w), sub=p.sizes[size]*qty;
  const sums=`<div><span>${t('subtotal')}</span><span>${money(sub)}</span></div><div><span>${t('delivery')}</span><span>${fee==null?t('byPhone'):fee===0?t('free'):money(fee)}</span></div><div class="tot"><span>${t('total')}</span><span>${money(sub+(fee||0))}${fee==null?t('plusDelivery'):''}</span></div>`;
  const form=showForm&&!result?`<form class="sec2" id="co" novalidate>
      <h2>${t('coTitle')}</h2>
      <div class="fields">
        <label>${t('fName')}<input id="fName" autocomplete="name" placeholder="${t('phName')}" value="${cust.name||''}"></label>
        <label>${t('fPhone')}<input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05 / 06 / 07 …" value="${cust.phone||''}"></label>
        <label>${t('fWilaya')}<select id="fWilaya"><option value="">${t('wChoose')}</option>${WILAYAS.map((x,i)=>`<option value="${x}" ${x===w?'selected':''}>${String(i+1).padStart(2,'0')} · ${x}</option>`).join('')}</select></label>
        <label>${t('fAddr')}<input id="fAddr" autocomplete="street-address" placeholder="${t('phAddr')}" value="${cust.addr||''}"></label>
        <input id="fHp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:fixed;left:-9999px;opacity:0;height:0;width:0">
      </div>
      <div class="sums" id="sums">${sums}</div>
      <button class="buy2" type="submit" id="confirm">${t('confirm')}</button>
    </form>`:'';
  const doneBox=result?`<div class="sec2 done"><h2>${result.ok?t('okT'):t('failT')}</h2><p>${result.msg}</p><pre>${result.text}</pre><button class="alt" id="cp">${t('copy')}</button></div>`:'';
  $('#main').innerHTML=`<div class="wrap">
    <div class="gal"><div class="pic"><img class="${shot>0?'photo':''}" src="${pics[shot]}" alt="${p.name}"></div>
      ${pics.length>1?`<div class="thumbs">${pics.map((u,i)=>`<button data-g="${i}" class="${i===shot?'on':''}" aria-label="${p.name} ${i+1}"><img src="${u}" alt=""></button>`).join('')}</div>`:''}</div>
    <div class="info">
      <div class="eyebrow">${p.no}</div><h1>${p.name}</h1>
      <div class="sub">${t('edp')} ${(p.gender==='f'?t('gf'):p.gender==='m'?t('gm'):t('gb'))}</div>
      ${desc?`<p class="desc">${desc}</p>`:''}
      <div class="notes">${p.notes.map(n=>`<span>${nn(n)}</span>`).join('')}</div>
      <div class="sizes">${Object.keys(p.sizes).map(sz=>`<button class="size ${+sz===size?'on':''}" data-s="${sz}"><span>${sz} ${t('ml')}</span><span>${money(p.sizes[sz])}</span></button>`).join('')}</div>
      <div class="qty"><span>${t('qty')}</span><button id="qm" type="button">−</button><b>${qty}</b><button id="qp" type="button">+</button></div>
      <button class="buy2" id="order" style="margin-top:12px">${t('order')} · ${money(sub)}</button>
      <div class="pay">${t('cod')}</div>
      ${form}${doneBox}
    </div>
    ${shots.length?`<section class="rev"><h2>${t('reviews')}</h2><div class="shots">${shots.map((u,i)=>`<button data-r="${i}" aria-label="${t('reviews')} ${i+1}"><img src="${u}" alt="" loading="lazy"></button>`).join('')}</div></section>`:''}</div>
    ${(p.more&&p.more.length)?`<section class="more">${p.more.map(u=>`<img src="${u}" alt="${p.name}" loading="lazy">`).join('')}</section>`:''}
    ${pitch.length?`<section class="pitch">${pitch.map(x=>`<article><h3>${x.t}</h3><p>${x.d}</p></article>`).join('')}</section>`:''}
    <section class="faq"><h2>${t('faqT')}</h2>${(typeof FAQ!=='undefined'?FAQ[LANG]||FAQ.fr:[]).map(x=>`<details><summary>${x.q}</summary><p>${x.a}</p></details>`).join('')}</section>`;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const o=document.createElement('div');o.className='lb';o.innerHTML=`<img src="${shots[+b.dataset.r]}" alt="">`;o.onclick=()=>o.remove();document.body.appendChild(o);});
  document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{size=+b.dataset.s;added=false;render();});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{shot=+b.dataset.g;render();});
  $('#qm').onclick=()=>{qty=Math.max(1,qty-1);render();}; $('#qp').onclick=()=>{qty=Math.min(20,qty+1);render();};
  $('#order').onclick=()=>{ const f=$('#co')||document.querySelector('.done'); if(f) f.scrollIntoView({behavior:'smooth',block:'start'}); };
  if($('#co')&&!window._ic){ window._ic=1; try{if(window.fbq)fbq('track','InitiateCheckout',{value:sub,currency:'DZD'});}catch(_){} }
  if($('#co')){
    $('#fWilaya').onchange=e=>{cust.wilaya=e.target.value; $('#sums').innerHTML=sumsFor();};
    function sumsFor(){const f=feeFor($('#fWilaya').value);return `<div><span>${t('subtotal')}</span><span>${money(sub)}</span></div><div><span>${t('delivery')}</span><span>${f==null?t('byPhone'):f===0?t('free'):money(f)}</span></div><div class="tot"><span>${t('total')}</span><span>${money(sub+(f||0))}${f==null?t('plusDelivery'):''}</span></div>`;}
    document.querySelectorAll('.fields input,.fields select').forEach(el=>el.addEventListener('input',()=>el.classList.remove('bad')));
    $('#co').addEventListener('submit',submitOrder);
  }
  if($('#cp')) $('#cp').onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(result.text):Promise.reject()).then(()=>toast(t('copied')),()=>{}); };
}
async function submitOrder(e){
  e.preventDefault();
  const c={name:$('#fName').value.trim(),phone:normPhone($('#fPhone').value),wilaya:$('#fWilaya').value,addr:$('#fAddr').value.trim()};
  ['fName','fPhone','fWilaya'].forEach(id=>$('#'+id).classList.remove('bad'));
  const bad=[c.name.length<2&&'fName',!/^0[567]\d{8}$/.test(c.phone)&&'fPhone',!c.wilaya&&'fWilaya'].filter(Boolean);
  if(bad.length){bad.forEach(id=>$('#'+id).classList.add('bad'));$('#'+bad[0]).focus();return toast(bad[0]==='fPhone'?t('badPhone'):t('badField'));}
  cust=c; try{localStorage.setItem('aloura-cust',JSON.stringify(c));}catch(_){}
  const fee=feeFor(c.wilaya), unitP=p.sizes[size], sub=unitP*qty, btn=$('#confirm'); btn.disabled=true;
  const text=`ALOURA — ${qty} × ${p.name} ${size}ml — ${money(sub)}\nNom : ${c.name}\nTéléphone : ${c.phone}\nWilaya : ${c.wilaya}`+(c.addr?`\nAdresse : ${c.addr}`:'')+`\nLivraison : ${fee==null?'à confirmer':money(fee)}\nPaiement à la livraison`;
  let sent=false,id='';
  try{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:c,items:[{product:p.name,size,qty,unitPrice:unitP}],subtotal:sub,delivery:fee,payment:'cash_on_delivery',hp:$('#fHp').value})});
    const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw 0; sent=true; id=j.id||'';}catch(_){}
  if(sent){ try{if(window.fbq)fbq('track','Purchase',{value:sub+(fee||0),currency:'DZD',content_type:'product',content_ids:[String(p.id)],num_items:qty});}catch(_){}
    result={ok:true,text,msg:t('okM').replace('{id}',id?t('okId').replace('{id}',id):'').replace('{phone}',c.phone)}; }
  else result={ok:false,text,msg:t('failM')};
  render(); $('#main').querySelector('.done').scrollIntoView({behavior:'smooth',block:'center'});
}
$('#langBtn').onclick=()=>{LANG=LANG==='fr'?'ar':'fr'; try{localStorage.setItem('aloura-lang',LANG);}catch(_){} render();};
render();
try{if(p&&window.fbq)fbq('track','ViewContent',{content_name:p.name,content_ids:[String(p.id)],content_type:'product'});}catch(_){}
</script>
